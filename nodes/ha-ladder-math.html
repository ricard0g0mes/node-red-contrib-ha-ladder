<script type="text/javascript">
    RED.nodes.registerType('ha-ladder-math', {
        category: 'ha-ladder',
        color: '#6AA38F',
        paletteLabel: 'hal-math',
        defaults: {
            operation: { value: "add", required: true },

            vartype: { value: "MA", required: true },
            address: { value: 0, required: true, validate: function(v) { return RED.validators.number(v) && (v >= 0) && (v <= 999); } },
            index:   { value: 0, required: true, validate: function (v) { return RED.validators.number(v) && (v >= 0) && (v <= 63); } },
            counter: { value: "PV", required: true },
            timer:   { value: "PT", required: true },

            vartype1: { value: "#", required: true },
            address1: { value: 0, required: true, validate: function(v) { return RED.validators.number(v) && (v >= 0) && (v <= 999); } },
            index1:   { value: 0, required: true, validate: function (v) { return RED.validators.number(v) && (v >= 0) && (v <= 63); } },
            counter1: { value: "CV", required: true },
            timer1:   { value: "ET", required: true },
            timeu1:   { value: "s", required: true },
            const1:   { value: 5, required: true, validate: function (v) { return !isNaN(Number(v)); } },
            fconst1:  { value: "PI", required: true },

            vartype2: { value: "#", required: true },
            address2: { value: 0, required: true, validate: function(v) { return RED.validators.number(v) && (v >= 0) && (v <= 999); } },
            index2:   { value: 0, required: true, validate: function (v) { return RED.validators.number(v) && (v >= 0) && (v <= 63); } },
            counter2: { value: "CV", required: true },
            timer2:   { value: "ET", required: true },
            timeu2:   { value: "s", required: true },
            const2:   { value: 10, required: true, validate: function (v) { return !isNaN(Number(v)); } },
            fconst2:  { value: "PI", required: true },

            tofix:    { value: 2, required: true, validate: function (v) { return RED.validators.number(v) && (v >= 0) && (v <= 20); } },
            name:     { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-superscript", 
        inputLabels: "(EN) boolean",
        outputLabels: ["(ENO) boolean"],
        label: function () {
            if (this.name)
                return this.name;
            
            var out_txt = this.operation + " (";

            switch(this.vartype1) {
                default:   out_txt += this.vartype1 + this.address1 + "." + this.index1; break;
                case "C":  out_txt += this.vartype1 + this.address1 + "." + this.counter1; break;
                case "T":  out_txt += this.vartype1 + this.address1 + "." + this.timer1; break;
                case "#":  out_txt += String(this.const1); break;
                case "#C": out_txt += this.fconst1; break;
                case "#T": out_txt += this.const1 + this.timeu1; break;
            }

            switch (this.operation) {
                    case "add":
                    case "sub":
                    case "mul":
                    case "div":
                    case "mod":
                    case "max":
                    case "min":
                    case "pow":
                    case "rnd2":
                        out_txt += ", ";
                        switch(this.vartype2) {
                            default:   out_txt += this.vartype2 + this.address2 + "." + this.index2; break;
                            case "C":  out_txt += this.vartype2 + this.address2 + "." + this.counter2; break;
                            case "T":  out_txt += this.vartype2 + this.address2 + "." + this.timer2; break;
                            case "#":  out_txt += String(this.const2); break;
                            case "#C": out_txt += this.fconst2; break;
                            case "#T": out_txt += this.const2 + this.timeu2; break; 
                        }
                }

            out_txt += ")";

            return out_txt;
        },
        labelStyle: function() { return this.name ? "node_label_italic" : ""; },
        oneditprepare: function () {
            function onoperation(operation) {
                $("#div-operand2").hide();

                switch (operation) {
                    case "add":
                    case "sub":
                    case "mul":
                    case "div":
                    case "mod":
                    case "max":
                    case "min":
                    case "pow":
                    case "rnd2":
                        $("#div-operand2").show();
                }
            }

            function onvartype(vartype) {
                $("#node-input-index").hide();
                $("#node-input-counter").hide();
                $("#node-input-timer").hide();
                $("#div-tofix").hide();

                switch (vartype) {
                    default:
                        $("#node-input-index").show();
                        $("#div-tofix").show();
                        break;
                    case "C":  
                        $("#node-input-counter").show();
                        break;
                    case "T":  
                        $("#node-input-timer").show();
                        break;
                }
            }

            function onvartype1(vartype) {
                $("#node-input-address1").hide();
                $("#div-point1").hide();
                $("#node-input-index1").hide();
                $("#node-input-counter1").hide();
                $("#node-input-timer1").hide();
                $("#node-input-timeu1").hide();
                $("#node-input-const1").hide();
                $("#node-input-fconst1").hide();

                switch (vartype) {
                    default:
                        $("#node-input-address1").show();
                        $("#div-point1").show();
                        $("#node-input-index1").show();
                        break;
                    case "C":  
                        $("#node-input-address1").show();
                        $("#div-point1").show();
                        $("#node-input-counter1").show();
                        break;
                    case "T":  
                        $("#node-input-address1").show();
                        $("#div-point1").show();
                        $("#node-input-timer1").show();
                        break;
                    case "#":  
                        $("#node-input-const1").show();
                        break;
                    case "#T": 
                        $("#node-input-const1").show();
                        $("#node-input-timeu1").show();
                        break;
                    case "#C": 
                        $("#node-input-fconst1").show();
                        break;
                }
            }

            function onvartype2(vartype) {
                $("#node-input-address2").hide();
                $("#div-point2").hide();
                $("#node-input-index2").hide();
                $("#node-input-counter2").hide();
                $("#node-input-timer2").hide();
                $("#node-input-timeu2").hide();
                $("#node-input-const2").hide();
                $("#node-input-fconst2").hide();

                switch (vartype) {
                    default:
                        $("#node-input-address2").show();
                        $("#div-point2").show();
                        $("#node-input-index2").show();
                        break;
                    case "C":  
                        $("#node-input-address2").show();
                        $("#div-point2").show();
                        $("#node-input-counter2").show();
                        break;
                    case "T":  
                        $("#node-input-address2").show();
                        $("#div-point2").show();
                        $("#node-input-timer2").show();
                        break;
                    case "#":  
                        $("#node-input-const2").show();
                        break;
                    case "#T": 
                        $("#node-input-const2").show();
                        $("#node-input-timeu2").show();
                        break;
                    case "#C": 
                        $("#node-input-fconst2").show();
                        break;
                }
            }

            $("#node-input-operation").on("change", function () { onoperation(this.value); }).change();
            $("#node-input-vartype").on("change", function () { onvartype(this.value); }).change();
            $("#node-input-vartype1").on("change", function () { onvartype1(this.value); }).change();
            $("#node-input-vartype2").on("change", function () { onvartype2(this.value); }).change();
        },
    });
</script>

<script type="text/html" data-help-name="ha-ladder-math">
    <p>HA Ladder Logic Calculation.</p>
    <h3><b>Input:</b></h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">boolean</span></dt>
        <dd>EN: Enable Input<dd>
        <dd><b>True</b> performs calculation<dd>
    </dl>
    <h3><b>Output:</b></h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">boolean</span></dt>
        <dd>ENO: Enable Output<dd>
        <dd><b>False</b> on error<dd>
    </dl>
    <h3><b>Variable (Operand-1):</b></h3>
        <dl class="message-properties">
            <dt><b>IA</b> Analog-Input<span class="property-type">number</span></dt>
            <dt><b>QA</b> Analog-Output<span class="property-type">number</span></dt>
            <dt><b>MA</b> Analog-Memory<span class="property-type">number</span></dt>
            <dt><b>T</b> Timer<span class="property-type">number</span></dt>
            <dd><b>.ET</b> Elapsed Time in ms.</dd>
            <dd><b>.PT</b> Preset in ms.</dd>
            <dt><b>C</b> Counter<span class="property-type">number</span></dt>
            <dd><b>.CV</b> Value</dd>
            <dd><b>.PV</b> Preset</dd>
            <dt><b>#</b> Number-Constant<span class="property-type">number</span></dt>
            <dt><b>#C</b> Math-Constant<span class="property-type">number</span></dt>
            <dt><b>#T</b> Timer-Constant<span class="property-type">number</span></dt>
        </dl>
    <h3><b>Variable (Operand-2):</b></h3>
        <dl class="message-properties">
            <dt><b>IA</b> Analog-Input<span class="property-type">number</span></dt>
            <dt><b>QA</b> Analog-Output<span class="property-type">number</span></dt>
            <dt><b>MA</b> Analog-Memory<span class="property-type">number</span></dt>
            <dt><b>T</b> Timer<span class="property-type">number</span></dt>
            <dd><b>.ET</b> Elapsed Time in ms.</dd>
            <dd><b>.PT</b> Preset in ms.</dd>
            <dt><b>C</b> Counter<span class="property-type">number</span></dt>
            <dd><b>.CV</b> Value </dd>
            <dd><b>.PV</b> Preset</dd>
            <dt><b>#</b> Number-Constant<span class="property-type">number</span></dt>
            <dt><b>#C</b> Math-Constant<span class="property-type">number</span></dt>
            <dt><b>#T</b> Timer-Constant<span class="property-type">number</span></dt>
        </dl>
    <h3><b>Variable (Result):</b></h3>
        <dl class="message-properties">
            <dt><b>QA</b> Analog-Output<span class="property-type">number</span></dt>
            <dt><b>MA</b> Analog-Memory<span class="property-type">number</span></dt>
            <dt><b>T</b> Timer<span class="property-type">number</span></dt>
            <dd><b>.PT</b> Preset in ms.</dd>
            <dt><b>C</b> Counter<span class="property-type">number</span></dt>
            <dd><b>.PV</b> Preset</dd>
        </dl>
    <h3><b>Details:</b></h3>
    <p>
        Calculates variables/constants.<br>
        Variables must exist.<br>
        Timer-Constant is converted to ms.<br>
        Fix-Decimal rounds digits after decimal point.<br>
        Status icon shows the output payload.<br>
        Status text shows Result.<br>
        <br>
        <b>Calculation with one Operand:</b><br>
        <ul>
            <li><b>inc</b> increment by 1</li>
            <li><b>dec</b> deccrement by 1</li>
            <li><b>acos</b> arccosine</li>
            <li><b>abs</b> absolute</li>
            <li><b>acos</b> arccosine</li>
            <li><b>acosh</b> hyperbolic arccosine</li>
            <li><b>asin</b> arcsine</li>
            <li><b>asinh</b> hyperbolic arcsine</li>
            <li><b>atan</b> hyperbolic arctangent</li>
            <li><b>cbrt</b> cube root</li>
            <li><b>ceil</b> smallest integer greater than or equal</li>
            <li><b>cos</b> cosine</li>
            <li><b>cosh</b> hyperbolic cosine</li>
            <li><b>exp</b> exponent to euler's constant</li>
            <li><b>floor</b> largest integer less than or equal</li>
            <li><b>log</b> natural logarithm</li>
            <li><b>log10</b> base-10 logarithm</li>
            <li><b>log2</b> base-2 logarithm</li>
            <li><b>random1</b> random number one range</li>
            <li><b>round</b> rounded to the nearest integer</li>
            <li><b>sin</b> sine</li>
            <li><b>sinh</b> hyperbolic sine</li>
            <li><b>sqrt</b> square</li>
            <li><b>tan</b> tangent</li>
            <li><b>tanh</b> hyperbolic tangent</li>
            <li><b>trunc</b> removing any fractional digits</li>
            <li><b>torad</b> convert to radians</li>
            <li><b>todeg</b> convert to degrees</li>
        </ul>
        <b>Calculation with two Operands:</b><br>
        <ul>
            <li><b>add</b> add</li>
            <li><b>sub</b> subrtact</li>
            <li><b>mul</b> multiple</li>
            <li><b>div</b> divide</li>
            <li><b>mod</b> remainder</li>
            <li><b>min</b> minimum</li>
            <li><b>max</b> maximum</li>
            <li><b>pow</b> power</li>
            <li><b>random2</b> random number two range</li>
        </ul>
    </p>
</script>
