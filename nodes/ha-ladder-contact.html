<script type="text/javascript">
    RED.nodes.registerType('ha-ladder-contact', {
        category: 'ha-ladder',
        paletteLabel: 'hal-in',
        color: '#7BA3B8',
        defaults: {
            operation: { value: "NO", required: true },
            source: { value: "ha", required: true },
            server: { value: "", type: "server", required: false },
            entity_id: { value: "" },
            vartype: { value: "M", required: true },
            address: { value: 0, required: true },
            index: { value: 0, required: true },
            counter: { value: "QU", required: true },
            timer: { value: "Q", required: true },
            fflop: { value: "Q", required: true },
            name: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        inputLabels: "(IN) boolean",
        outputLabels: ["(OUT) boolean"],
        icon: function () {
            switch (this.operation) {
                case "NC": return "font-awesome/fa-toggle-off";
                case "P": return "font-awesome/fa-caret-square-o-up";
                case "N": return "font-awesome/fa-caret-square-o-down";
                default: return "font-awesome/fa-toggle-on";
            }
        },
        label: function () {
            if (this.name) return this.name;
            if (this.source === "ha") return this.entity_id || "contact";
            return "contact";
        },
        labelStyle: function () { return this.name ? "node_label_italic" : ""; },
        oneditprepare: function () {
            function sync() {
                const src = $("#node-input-source").val();
                if (src === "ha") {
                    $(".ha-only").show();
                    $(".mem-only").hide();
                } else {
                    $(".ha-only").hide();
                    $(".mem-only").show();
                }
            }
            $("#node-input-source").on("change", sync);
            sync();
        }
    });
</script>

<script type="text/html" data-template-name="ha-ladder-contact">
    <div class="form-row">
        <label style="width:100%;border-bottom:2px solid #000"><b>HA Ladder Contact</b></label>
    </div>
    <div class="form-row">
        <label for="node-input-operation">Operation</label>
        <select id="node-input-operation">
            <option value="NO">Normally Open (NO)</option>
            <option value="NC">Normally Close (NC)</option>
            <option value="P">Positive Transition</option>
            <option value="N">Negative Transition</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-source">Source</label>
        <select id="node-input-source">
            <option value="ha">Home Assistant entity</option>
            <option value="mem">Internal M/C/T/FF</option>
        </select>
    </div>
    <div class="form-row ha-only">
        <label for="node-input-server">HA Server</label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row ha-only">
        <label for="node-input-entity_id">Entity</label>
        <input type="text" id="node-input-entity_id" placeholder="binary_sensor.foo / event.bar / light.x">
    </div>
    <div class="form-row mem-only">
        <label for="node-input-vartype">Memory</label>
        <select id="node-input-vartype" style="width:auto">
            <option value="M">M</option>
            <option value="C">C</option>
            <option value="T">T</option>
            <option value="FF">FF</option>
        </select>
        <input id="node-input-address" type="number" min="0" max="999" style="width:auto">
        <b>.</b>
        <input id="node-input-index" type="number" min="0" max="63" style="width:auto">
        <select id="node-input-counter" style="width:auto">
            <option value="QU">QU</option><option value="QD">QD</option><option value="R">R</option>
        </select>
        <select id="node-input-timer" style="width:auto">
            <option value="Q">Q</option><option value="R">R</option><option value="TT">TT</option>
        </select>
        <select id="node-input-fflop" style="width:auto">
            <option value="Q">Q</option><option value="R">R</option><option value="S">S</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-name">Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/html" data-help-name="ha-ladder-contact">
    <p>Ladder contact. Source = HA entity state (<code>on</code>/<code>off</code>…) or internal memory.</p>
    <p><code>event.*</code> entities pulse true for one scan when the event timestamp changes.</p>
</script>
